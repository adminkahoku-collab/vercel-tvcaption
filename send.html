<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>リアルタイム字幕 Sender (ダイレクトモード)</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 1. Firebase Realtime Database 初期化設定
    const firebaseConfig = {
      databaseURL: "https://caption-db-cbff9-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const clearBtn = document.getElementById('clearBtn');
    const statusEl = document.getElementById('status');
    const previewArea = document.getElementById('previewArea');

    let recognition;
    let isExplicitlyStopped = false;
    let interimTimer = null;
    let lastInterimText = '';
    let lastSentFinalText = '';

    // Firebase への直接送信処理
    async function sendToFirebase(text, isInterim = false) {
      const trimmedText = text ? text.trim() : '';
      if (!trimmedText) return;

      if (isInterim) {
        // 仮テキスト送信（ノード上書き）
        const interimRef = ref(db, 'transcripts/interim');
        await set(interimRef, {
          content: trimmedText,
          timestamp: Date.now()
        });
        updatePreview(`[認識中] ${trimmedText}`, true);
      } else {
        // 直前と同じ確定テキストならスキップ（重複防止）
        if (trimmedText === lastSentFinalText) {
          await remove(ref(db, 'transcripts/interim'));
          return;
        }

        lastSentFinalText = trimmedText;
        await remove(ref(db, 'transcripts/interim'));

        // 確定テキストを送信
        const listRef = ref(db, 'transcripts/list');
        await push(listRef, {
          content: trimmedText,
          timestamp: Date.now()
        });
        updatePreview(`[確定] ${trimmedText}`, false);
      }
    }

    // プレビュー表示更新
    function updatePreview(msg, isInterim) {
      previewArea.textContent = msg;
      previewArea.style.color = isInterim ? '#888' : '#fff';
    }

    // 音声認識（Web Speech API）初期化
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = true;

      // 開始時の処理（UI制御を一括化）
      recognition.onstart = () => { 
        statusEl.textContent = '認識中（高速ダイレクトモード）'; 
        statusEl.style.color = '#00e676';
        startBtn.disabled = true;
        stopBtn.disabled = false;
      };

      // エラーハンドリングの追加（再起動ループ・アクセス拒否の対策）
      recognition.onerror = (event) => {
        console.error('Speech recognition error:', event.error);
        
        if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
          statusEl.textContent = 'マイク使用が許可されていません';
          statusEl.style.color = '#ff5252';
          isExplicitlyStopped = true;
        } else if (event.error === 'network') {
          statusEl.textContent = 'ネットワークエラーが発生しました';
          statusEl.style.color = '#ff5252';
        }
      };

      // 終了時の処理（再起動時の例外対策とインターバル追加）
      recognition.onend = () => { 
        // 残った途中経過テキストがあれば確定送信
        if (lastInterimText.trim() !== '') {
          sendToFirebase(lastInterimText, false);
          lastInterimText = '';
        }
        
        if (!isExplicitlyStopped) {
          // 連続認識を維持するための安全な再起動
          setTimeout(() => {
            try {
              recognition.start();
            } catch (e) {
              console.log('再起動スキップ（既に起動中または準備未完了）:', e);
            }
          }, 100);
        } else {
          statusEl.textContent = '停止中';
          statusEl.style.color = '#ff5252';
          startBtn.disabled = false;
          stopBtn.disabled = true;
        }
      };

      // 認識結果受信時
      recognition.onresult = (event) => {
        let interimText = '';
        let currentFinal = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            currentFinal += event.results[i][0].transcript;
          } else {
            interimText += event.results[i][0].transcript;
          }
        }

        clearTimeout(interimTimer);

        if (currentFinal !== '') {
          lastInterimText = '';
          sendToFirebase(currentFinal, false);
        } else if (interimText !== '') {
          lastInterimText = interimText;
          
          // 短いディレイで連打送信を抑止して送信
          interimTimer = setTimeout(() => {
            sendToFirebase(interimText, true);
          }, 300);

          // ※ 二重送信の原因となる forceFinalTimer (タイマー強制確定) は削除し、
          // Web Speech API 本来の isFinal / onend 制御に一本化しています。
        }
      };
    } else {
