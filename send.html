<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>リアルタイム字幕 Sender (ダイレクトモード)</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 1. Firebase Realtime Database 初期化設定
    const firebaseConfig = {
      databaseURL: "https://caption-db-cbff9-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const clearBtn = document.getElementById('clearBtn');
    const statusEl = document.getElementById('status');
    const previewArea = document.getElementById('previewArea');

    let recognition;
    let isExplicitlyStopped = false;
    let interimTimer = null;
    let forceFinalTimer = null;
    let lastInterimText = '';
    let lastSentFinalText = '';

    // Firebase への直接送信処理（生成AIなし）
    async function sendToFirebase(text, isInterim = false) {
      const trimmedText = text ? text.trim() : '';
      if (!trimmedText) return;

      if (isInterim) {
        // 仮テキスト送信（ノード上書き）
        const interimRef = ref(db, 'transcripts/interim');
        await set(interimRef, {
          content: trimmedText,
          timestamp: Date.now()
        });
        updatePreview(`[認識中] ${trimmedText}`, true);
      } else {
        // 直前と同じ確定テキストならスキップ（重複防止）
        if (trimmedText === lastSentFinalText) {
          await remove(ref(db, 'transcripts/interim'));
          return;
        }

        lastSentFinalText = trimmedText;
        await remove(ref(db, 'transcripts/interim'));

        // 確定テキストをそのまま直接送信
        const listRef = ref(db, 'transcripts/list');
        await push(listRef, {
          content: trimmedText,
          timestamp: Date.now()
        });
        updatePreview(`[確定] ${trimmedText}`, false);
      }
    }

    // プレビュー表示更新
    function updatePreview(msg, isInterim) {
      previewArea.textContent = msg;
      previewArea.style.color = isInterim ? '#888' : '#fff';
    }

    // 音声認識（Web Speech API）初期化
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = () => { 
        statusEl.textContent = '認識中（高速ダイレクトモード）'; 
        statusEl.style.color = '#00e676';
      };
      
      recognition.onend = () => { 
        if (lastInterimText.trim() !== '') {
          sendToFirebase(lastInterimText, false);
          lastInterimText = '';
        }
        
        if (!isExplicitlyStopped) {
          recognition.start();
        } else {
          statusEl.textContent = '停止中';
          statusEl.style.color = '#ff5252';
        }
      };

      recognition.onresult = (event) => {
        let interimText = '';
        let currentFinal = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            currentFinal += event.results[i][0].transcript;
          } else {
            interimText += event.results[i][0].transcript;
          }
        }

        clearTimeout(interimTimer);
        clearTimeout(forceFinalTimer);

        if (currentFinal !== '') {
          lastInterimText = '';
          sendToFirebase(currentFinal, false);
        } else if (interimText !== '') {
          lastInterimText = interimText;
          
          interimTimer = setTimeout(() => {
            sendToFirebase(interimText, true);
          }, 300);

          forceFinalTimer = setTimeout(() => {
            if (lastInterimText.trim() !== '') {
              sendToFirebase(lastInterimText, false);
              lastInterimText = '';
            }
          }, 2500);
        }
      };
    } else {
      alert('お使いのブラウザは Web Speech API に対応していません。Google Chrome をご使用ください。');
    }

    // ボタンイベント
    startBtn.addEventListener('click', () => {
      if (!recognition) return;
      isExplicitlyStopped = false;
      lastSentFinalText = '';
      recognition.start();
      startBtn.disabled = true;
      stopBtn.disabled = false;
    });

    stopBtn.addEventListener('click', () => {
      if (!recognition) return;
      isExplicitlyStopped = true;
      clearTimeout(interimTimer);
      clearTimeout(forceFinalTimer);
      
      if (lastInterimText.trim() !== '') {
        sendToFirebase(lastInterimText, false);
        lastInterimText = '';
      }

      recognition.stop();
      startBtn.disabled = false;
      stopBtn.disabled = true;
    });

    // ログ消去ボタン
    clearBtn.addEventListener('click', async () => {
      if (confirm('すべての字幕ログを削除しますか？')) {
        try {
          const rootRef = ref(db, 'transcripts');
          await remove(rootRef);
          
          lastInterimText = '';
          lastSentFinalText = '';
          previewArea.textContent = 'ログをクリアしました。';
          previewArea.style.color = '#888';
          
          alert('ログを全消去しました。');
        } catch (error) {
          console.error('消去エラー:', error);
          alert('消去に失敗しました。');
        }
      }
    });
  </script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #222; color: #fff; }
    button { padding: 10px 20px; font-size: 1rem; margin-right: 10px; cursor: pointer; }
    .status { margin-top: 15px; font-weight: bold; }
    .preview { margin-top: 20px; padding: 10px; border: 1px solid #555; background: #333; min-height: 50px; }
  </style>
</head>
<body>

  <h2>音声認識 送信画面 (高速ダイレクトモード)</h2>

  <div>
    <button id="startBtn">認識＆送信開始</button>
    <button id="stopBtn" disabled>停止</button>
    <button id="clearBtn">ログ消去</button>
  </div>

  <div class="status">ステータス: <span id="status" style="color: #ff5252;">停止中</span></div>

  <div class="preview" id="previewArea">ここに認識されたテキストが表示されます...</div>

</body>
</html>
