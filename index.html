<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>リアルタイム字幕・AI要約閲覧</title>
<style>
* { box-sizing: border-box; }
body {
  display: flex;
  font-family: sans-serif;
  margin: 0;
  padding: 10px;
  height: 100vh;
  background-color: #121212;
  color: #e0e0e0;
  overflow: hidden;
}

/* 左パネル：字幕表示 */
#left-panel {
  flex: 2;
  padding-right: 10px;
  border-right: 1px solid #333;
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
}

/* スクロールエリア共通 */
#scrollArea, #summaryScrollArea {
  flex: 1;
  overflow-y: auto;
  padding-right: 5px;
}

/* 確定字幕ログのスタイル */
.log-item {
  margin-bottom: 4px;
  padding-bottom: 3px;
  border-bottom: 1px dashed #333;
  line-height: 1.4;
  font-size: 0.95rem;
  word-break: break-word;
}

/* タイムスタンプのデザイン */
.timestamp {
  color: #00e676;
  font-size: 0.85rem;
  font-family: monospace;
  margin-right: 8px;
}

/* 発話中の途中経過エリア */
.interim {
  color: #aaa;
  font-style: italic;
  margin-top: 8px;
  line-height: 1.5;
  font-size: 0.95rem;
  word-break: break-word;
}

.bottom-spacer {
  height: 60px;
  flex-shrink: 0;
}

/* 右パネル：AI要約 */
#right-panel {
  flex: 1.2;
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
  background-color: #1e1e1e;
  border-radius: 6px;
  padding: 12px;
  margin-left: 8px;
}

h2 {
  margin-top: 0;
  font-size: 1.1rem;
  border-bottom: 2px solid #333;
  padding-bottom: 6px;
  color: #00e676;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-shrink: 0;
}

.interval-badge {
  font-size: 0.8rem;
  color: #aaa;
  font-weight: normal;
}

.btn-group { 
  margin-bottom: 10px; 
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  flex-shrink: 0;
}

button {
  padding: 6px 12px;
  cursor: pointer;
  background-color: #333;
  color: #fff;
  border: 1px solid #555;
  border-radius: 4px;
  font-size: 0.85rem;
  transition: background 0.2s, border-color 0.2s;
}

button:hover {
  background-color: #444;
}

/* 一時停止ボタン */
#pauseBtn {
  background-color: #1b5e20;
  border-color: #2e7d32;
  font-weight: bold;
}
#pauseBtn:hover {
  background-color: #2e7d32;
}
#pauseBtn.paused {
  background-color: #b71c1c;
  border-color: #e53935;
}
#pauseBtn.paused:hover {
  background-color: #c62828;
}

/* 積み上げ型要約カードのデザイン */
.summary-item {
  background: #2a2a2a;
  color: #f0f0f0;
  padding: 10px 12px;
  border: 1px solid #444;
  border-left: 4px solid #00e676;
  border-radius: 4px;
  margin-bottom: 10px;
  line-height: 1.5;
  font-size: 0.9rem;
}

.summary-header {
  font-size: 0.8rem;
  color: #00e676;
  font-weight: bold;
  margin-bottom: 6px;
  border-bottom: 1px solid #3a3a3a;
  padding-bottom: 3px;
}

.summary-body {
  white-space: pre-wrap;
  word-break: break-word;
}

.empty-notice {
  color: #888;
  font-size: 0.9rem;
  padding: 10px;
}
</style>
</head>
<body>

<!-- 左側：リアルタイム字幕表示エリア -->
<div id="left-panel">
  <h2>リアルタイム字幕</h2>
  <div class="btn-group">
    <button id="pauseBtn">⏸ 更新を一時停止</button>
    <button id="dlLogTxtBtn">字幕をTXTで保存</button>
    <button id="dlLogMdBtn">字幕をMarkdownで保存</button>
  </div>

  <div id="scrollArea">
    <div id="logContainer"></div>
    <div id="interimBox" class="interim"></div>
    <div class="bottom-spacer"></div>
  </div>
</div>

<!-- 右側：AI要約表示＆ダウンロードエリア（履歴積み上げ型） -->
<div id="right-panel">
  <h2>
    <span>会議のAI要約（履歴）</span>
    <span id="intervalBadge" class="interval-badge">（※5分間隔で追加）</span>
  </h2>
  <div class="btn-group">
    <button id="dlTxtBtn">要約をTXTで保存</button>
    <button id="dlMdBtn">要約をMarkdownで保存</button>
  </div>
  
  <div id="summaryScrollArea">
    <div id="summaryContainer">
      <div id="summaryPlaceholder" class="empty-notice">要約を待機中...</div>
    </div>
    <div class="bottom-spacer"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onChildAdded, onValue, onChildRemoved } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  databaseURL: "https://caption-db-cbff9-default-rtdb.asia-southeast1.firebasedatabase.app"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const logContainer = document.getElementById('logContainer');
const interimBox = document.getElementById('interimBox');
const summaryContainer = document.getElementById('summaryContainer');
const intervalBadge = document.getElementById('intervalBadge');
const scrollArea = document.getElementById('scrollArea');
const summaryScrollArea = document.getElementById('summaryScrollArea');
const pauseBtn = document.getElementById('pauseBtn');

let isPaused = false;
let pendingLogs = [];
let pendingSummaries = [];
let latestInterimText = "";

function scrollToBottom() {
  scrollArea.scrollTop = scrollArea.scrollHeight;
}

function scrollSummaryToBottom() {
  summaryScrollArea.scrollTop = summaryScrollArea.scrollHeight;
}

// 1件分の字幕ログを描画
function appendLogElement(data) {
  const div = document.createElement('div');
  div.className = 'log-item';

  const rawTime = data.timestamp || data.createdAt || data.time;
  const timeObj = rawTime ? new Date(rawTime) : new Date();
  const timeStr = timeObj.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

  div.innerHTML = `<span class="timestamp">[${timeStr}]</span>${data.content}`;
  logContainer.appendChild(div);
}

// 1件分の要約ブロックを描画
function appendSummaryElement(data) {
  const placeholder = document.getElementById('summaryPlaceholder');
  if (placeholder) placeholder.remove();

  const card = document.createElement('div');
  card.className = 'summary-item';

  const header = document.createElement('div');
  header.className = 'summary-header';
  const timeLabel = data.timeRange ? `【${data.timeRange} の要点】` : `【要点メモ】`;
  header.textContent = timeLabel;

  const body = document.createElement('div');
  body.className = 'summary-body';
  body.textContent = data.text;

  card.appendChild(header);
  card.appendChild(body);
  summaryContainer.appendChild(card);

  if (data.intervalMinutes) {
    intervalBadge.innerText = `（※${data.intervalMinutes}分間隔で追加）`;
  }
}

// 一時停止ボタンの表示更新
function updatePauseButtonUI() {
  if (isPaused) {
    pauseBtn.classList.add('paused');
    const totalPending = pendingLogs.length + pendingSummaries.length;
    const countText = totalPending > 0 ? ` (未読 ${totalPending}件)` : "";
    pauseBtn.innerText = `▶ 更新再開${countText}`;
  } else {
    pauseBtn.classList.remove('paused');
    pauseBtn.innerText = "⏸ 更新を一時停止";
  }
}

pauseBtn.addEventListener('click', () => {
  isPaused = !isPaused;

  if (!isPaused) {
    if (pendingLogs.length > 0) {
      pendingLogs.forEach(item => appendLogElement(item));
      pendingLogs = [];
    }
    if (pendingSummaries.length > 0) {
      pendingSummaries.forEach(item => appendSummaryElement(item));
      pendingSummaries = [];
      scrollSummaryToBottom();
    }
    interimBox.innerText = latestInterimText ? `[発話中...] ${latestInterimText}` : '';
    scrollToBottom();
  }

  updatePauseButtonUI();
});

// 確定字幕ログ (transcripts/list) の受信
const listRef = ref(db, 'transcripts/list');
onChildAdded(listRef, (snapshot) => {
  const data = snapshot.val();
  if (data && data.content) {
    if (isPaused) {
      pendingLogs.push(data);
      updatePauseButtonUI();
    } else {
      appendLogElement(data);
      scrollToBottom();
    }
  }
});

// ログ消去時のリセット処理
onChildRemoved(listRef, () => {
  logContainer.innerHTML = '';
  interimBox.innerText = '';
  summaryContainer.innerHTML = '<div id="summaryPlaceholder" class="empty-notice">要約データはまだありません。</div>';
  intervalBadge.innerText = '（※5分間隔で追加）';

  pendingLogs = [];
  pendingSummaries = [];
  latestInterimText = "";
  updatePauseButtonUI();
});

// 途中経過 (transcripts/interim) の受信
const interimRef = ref(db, 'transcripts/interim');
onValue(interimRef, (snapshot) => {
  const data = snapshot.val();
  latestInterimText = (data && data.content) ? data.content : "";

  if (!isPaused) {
    if (latestInterimText) {
      interimBox.innerText = `[発話中...] ${latestInterimText}`;
      scrollToBottom();
    } else {
      interimBox.innerText = '';
    }
  }
});

// 要約履歴 (transcripts/summary_list) の追加受信
const summaryListRef = ref(db, 'transcripts/summary_list');
onChildAdded(summaryListRef, (snapshot) => {
  const data = snapshot.val();
  if (data && data.text) {
    if (isPaused) {
      pendingSummaries.push(data);
      updatePauseButtonUI();
    } else {
      appendSummaryElement(data);
      scrollSummaryToBottom();
    }
  }
});

// 共通ダウンロード処理
function downloadFile(content, fileName, mimeType) {
  const blob = new Blob([content], { type: `${mimeType};charset=utf-8;` });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// 字幕ログの保存
function downloadLog(format) {
  const items = Array.from(logContainer.querySelectorAll('.log-item'));
  if (items.length === 0) {
    alert('保存できる字幕ログがありません。');
    return;
  }

  const now = new Date();
  const datePrefix = now.toISOString().split('T')[0];
  const logTexts = items.map(el => el.innerText);

  if (format === 'txt') {
    downloadFile(logTexts.join('\n'), `会議字幕ログ_${datePrefix}.txt`, 'text/plain');
  } else if (format === 'md') {
    const mdContent = `# 会議字幕ログ (${datePrefix})\n\n` + 
      logTexts.map(t => `- ${t}`).join('\n') + 
      `\n\n---\n*出力日時: ${now.toLocaleString('ja-JP')}*`;
    downloadFile(mdContent, `会議字幕ログ_${datePrefix}.md`, 'text/markdown');
  }
}

// 要約履歴の保存（積み上がった全カードを一括出力）
function downloadSummary(format) {
  const cards = Array.from(summaryContainer.querySelectorAll('.summary-item'));
  if (cards.length === 0) {
    alert('保存できる要約データがありません。');
    return;
  }

  const now = new Date();
  const datePrefix = now.toISOString().split('T')[0];

  if (format === 'txt') {
    const textContent = cards.map(card => {
      const header = card.querySelector('.summary-header').innerText;
      const body = card.querySelector('.summary-body').innerText;
      return `${header}\n${body}`;
    }).join('\n\n----------------------------------------\n\n');

    downloadFile(textContent, `会議要約_${datePrefix}.txt`, 'text/plain');
  } else if (format === 'md') {
    const mdBlocks = cards.map(card => {
      const header = card.querySelector('.summary-header').innerText;
      const body = card.querySelector('.summary-body').innerText;
      return `### ${header}\n\n${body}`;
    }).join('\n\n---\n\n');

    const mdContent = `# 会議要約レポート (${datePrefix})\n\n${mdBlocks}\n\n---\n*出力日時: ${now.toLocaleString('ja-JP')}*`;
    downloadFile(mdContent, `会議要約_${datePrefix}.md`, 'text/markdown');
  }
}

document.getElementById('dlLogTxtBtn').addEventListener('click', () => downloadLog('txt'));
document.getElementById('dlLogMdBtn').addEventListener('click', () => downloadLog('md'));
document.getElementById('dlTxtBtn').addEventListener('click', () => downloadSummary('txt'));
document.getElementById('dlMdBtn').addEventListener('click', () => downloadSummary('md'));
</script>
</body>
</html>
