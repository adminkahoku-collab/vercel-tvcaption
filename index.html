<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム字幕 & 会議要約 表示画面</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #121212; color: #fff; max-width: 1000px; margin: 0 auto; }
    h2 { border-bottom: 2px solid #333; padding-bottom: 8px; margin-top: 25px; display: flex; align-items: baseline; gap: 10px; }
    
    .interval-badge { font-size: 0.85rem; color: #aaa; font-weight: normal; }

    .box { background: #1e1e1e; padding: 18px; border-radius: 8px; border: 1px solid #333; min-height: 80px; line-height: 1.7; word-break: break-all; }
    
    /* リアルタイム字幕用スタイル */
    #interimArea { color: #888; font-style: italic; margin-bottom: 10px; min-height: 24px; }
    #listArea { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column-reverse; }
    .caption-item { padding: 6px 0; border-bottom: 1px solid #2a2a2a; color: #e0e0e0; }

    /* 要約表示用スタイル（シンプルな箇条書き） */
    #summaryArea { white-space: pre-wrap; color: #00e676; font-size: 1.05rem; line-height: 1.8; }
    .updated-time { font-size: 0.8rem; color: #666; margin-top: 10px; text-align: right; }
  </style>
</head>
<body>

  <h2>
    <span>会議のAI要約</span>
    <span id="intervalBadge" class="interval-badge">（※--分間隔で表示）</span>
  </h2>
  <div class="box">
    <div id="summaryArea">要約データを待機中...</div>
    <div id="updatedTime" class="updated-time"></div>
  </div>

  <h2>リアルタイム字幕</h2>
  <div id="interimArea">[認識中...]</div>
  <div class="box">
    <div id="listArea">字幕ログを待機中...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://caption-db-cbff9-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const summaryArea = document.getElementById('summaryArea');
    const intervalBadge = document.getElementById('intervalBadge');
    const updatedTime = document.getElementById('updatedTime');
    const interimArea = document.getElementById('interimArea');
    const listArea = document.getElementById('listArea');

    // 1. AI要約の受信処理（間隔分数も自動取得）
    onValue(ref(db, 'transcripts/summary'), (snapshot) => {
      const data = snapshot.val();
      if (data && data.text) {
        // 間隔（分）の設定があれば「（※〇分間隔で表示）」と動的書き換え
        const mins = data.intervalMinutes || 20;
        intervalBadge.textContent = `（※${mins}分間隔で表示）`;

        // 不要な「###」や「**」を画面表示時にも念のため削ぎ落とす安全フィルター
        let cleanText = data.text
          .replace(/^###\s*/gm, '')
          .replace(/\*\*/g, '');

        summaryArea.textContent = cleanText;

        if (data.updatedAt) {
          const timeStr = new Date(data.updatedAt).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          updatedTime.textContent = `最終更新: ${timeStr}`;
        }
      } else {
        summaryArea.textContent = 'まだ要約は生成されていません。';
      }
    });

    // 2. 認識中テキスト（interim）の受信
    onValue(ref(db, 'transcripts/interim'), (snapshot) => {
      const data = snapshot.val();
      if (data && data.content) {
        interimArea.textContent = `[認識中...] ${data.content}`;
      } else {
        interimArea.textContent = '';
      }
    });

    // 3. 確定字幕リスト（list）の受信
    onValue(ref(db, 'transcripts/list'), (snapshot) => {
      const data = snapshot.val();
      if (data) {
        const items = Object.values(data);
        listArea.innerHTML = items.map(item => `<div class="caption-item">${item.content}</div>`).join('');
      } else {
        listArea.innerHTML = '字幕ログはありません。';
      }
    });
  </script>
</body>
</html>
