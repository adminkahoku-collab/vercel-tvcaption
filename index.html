<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>リアルタイム字幕・AI要約閲覧</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { display: flex; font-family: sans-serif; margin: 0; padding: 10px; height: 100vh; box-sizing: border-box; }
    #left-panel { flex: 2; padding-right: 15px; border-right: 2px solid #ccc; overflow-y: auto; }
    #right-panel { flex: 1; padding-left: 15px; overflow-y: auto; background-color: #f9f9f9; }
    .log-item { margin-bottom: 8px; border-bottom: 1px dashed #eee; padding-bottom: 4px; }
    .interim { color: #888; italic: true; }
    #summaryBox { white-space: pre-wrap; background: #fff; padding: 10px; border: 1px solid #ddd; border-radius: 4px; min-height: 200px; }
    .btn-group { margin-bottom: 10px; }
    button { padding: 6px 12px; margin-right: 5px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- 左側：リアルタイム字幕表示エリア -->
  <div id="left-panel">
    <h2>リアルタイム字幕</h2>
    <div id="logContainer"></div>
    <div id="interimBox" class="interim"></div>
  </div>

  <!-- 右側：AI要約表示＆ダウンロードエリア -->
  <div id="right-panel">
    <h2>会議のAI要約</h2>
    <div class="btn-group">
      <button onclick="downloadSummary('txt')">要約をTXTで保存</button>
      <button onclick="downloadSummary('md')">要約をMarkdownで保存</button>
    </div>
    <div id="summaryBox">要約を待機中...</div>
    <p style="font-size:12px; color:#666;" id="updateTime"></p>
  </div>

  <script>
    // --------------------------------------------------
    // 1. Firebase 初期化
    // --------------------------------------------------
    const firebaseConfig = {
      databaseURL: "https://<YOUR-FIREBASE-APP>.firebaseio.com"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let currentSummaryText = ""; // ダウンロード用グローバル変数

    // --------------------------------------------------
    // 2. 文字起こし（確定ログ）の受信監視
    // --------------------------------------------------
    const logContainer = document.getElementById('logContainer');
    
    db.ref('transcripts/list').on('child_added', (snapshot) => {
      const data = snapshot.val();
      const div = document.createElement('div');
      div.className = 'log-item';
      div.innerText = data.content;
      logContainer.appendChild(div);
      // 自動最下部スクロール
      document.getElementById('left-panel').scrollTop = document.getElementById('left-panel').scrollHeight;
    });

    // 途中経過（interim）の受信監視
    db.ref('transcripts/interim').on('value', (snapshot) => {
      const data = snapshot.val();
      const interimBox = document.getElementById('interimBox');
      if (data && data.content) {
        interimBox.innerText = `[発話中...] ${data.content}`;
      } else {
        interimBox.innerText = '';
      }
    });

    // --------------------------------------------------
    // 3. 要約データ (transcripts/summary) のリアルタイム受信
    // --------------------------------------------------
    db.ref('transcripts/summary').on('value', (snapshot) => {
      const data = snapshot.val();
      if (data && data.text) {
        currentSummaryText = data.text;
        document.getElementById('summaryBox').innerText = data.text;
        
        const dateStr = new Date(data.updatedAt).toLocaleTimeString('ja-JP');
        document.getElementById('updateTime').innerText = `最終要約更新: ${dateStr}`;
      } else {
        document.getElementById('summaryBox').innerText = '要約データはまだありません。';
        document.getElementById('updateTime').innerText = '';
        currentSummaryText = "";
      }
    });

    // --------------------------------------------------
    // 4. 要約データのダウンロード機能
    // --------------------------------------------------
    function downloadSummary(format) {
      if (!currentSummaryText) {
        alert('保存できる要約データがありません。');
        return;
      }

      const now = new Date();
      const datePrefix = now.toISOString().split('T')[0]; // YYYY-MM-DD
      const fileName = `会議要約_${datePrefix}.${format}`;
      
      let fileContent = currentSummaryText;
      let mimeType = 'text/plain';

      if (format === 'md') {
        fileContent = `# 会議要約レポート (${datePrefix})\n\n${currentSummaryText}\n\n---\n*自動生成日時: ${now.toLocaleString('ja-JP')}*`;
        mimeType = 'text/markdown';
      }

      const blob = new Blob([fileContent], { type: `${mimeType};charset=utf-8;` });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
