<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>リアルタイム字幕・AI要約閲覧</title>
  <style>
    * { box-sizing: border-box; }
    body {
      display: flex;
      font-family: sans-serif;
      margin: 0;
      padding: 10px;
      height: 100vh;
      background-color: #121212; /* 黒ベース */
      color: #e0e0e0;             /* 白抜き文字 */
    }
    
    /* 左パネル：字幕表示 */
    #left-panel {
      flex: 2;
      padding-right: 10px;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    
    /* 過去ログ表示エリア */
    #logContainer {
      flex-grow: 1;
      overflow-y: auto;
      padding-right: 5px;
    }
    
    /* 字幕の文言：隙間を調整 */
    .log-item {
      margin-bottom: 6px;   /* 点線の下側（次の発言との間）の隙間 */
      padding-bottom: 4px;  /* 文字と点線の間の隙間 */
      border-bottom: 1px dashed #333; /* 点線 */
      line-height: 1.4;
      font-size: 0.95rem;
      word-break: break-word;
    }

    /* タイムスタンプのデザイン */
    .timestamp {
      color: #00e676; /* サブカラーのグリーンで強調 */
      font-size: 0.85rem;
      font-family: monospace;
      margin-right: 8px;
    }
    
    /* 発話中の途中経過エリア */
    .interim {
      color: #aaa;
      font-style: italic;
      margin-top: 8px;
      padding: 4px 0 8px 0;
      line-height: 1.5;
      /min-height: 1.5em;
      font-size: 0.95rem;
    }

    /* 右パネル：AI要約 */
    #right-panel {
      flex: 1;
      padding-left: 15px;
      overflow-y: auto;
      background-color: #1e1e1e;
      border-radius: 6px;
      padding: 12px;
      margin-left: 5px;
    }

    h2 {
      margin-top: 0;
      font-size: 1.1rem;
      border-bottom: 2px solid #333;
      padding-bottom: 6px;
      color: #00e676;
    }

    .btn-group { margin-bottom: 10px; }
    
    button {
      padding: 6px 12px;
      margin-right: 6px;
      cursor: pointer;
      background-color: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 4px;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #444;
    }

    #summaryBox {
      white-space: pre-wrap;
      background: #2a2a2a;
      color: #f0f0f0;
      padding: 10px;
      border: 1px solid #444;
      border-radius: 4px;
      min-height: 200px;
      line-height: 1.5;
      font-size: 0.9rem;
    }

    #updateTime {
      font-size: 0.8rem;
      color: #888;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- 左側：リアルタイム字幕表示エリア -->
  <div id="left-panel">
    <h2>リアルタイム字幕</h2>
    <div class="btn-group">
      <button id="dlLogTxtBtn">字幕をTXTで保存</button>
      <button id="dlLogMdBtn">字幕をMarkdownで保存</button>
    </div>
    <div id="logContainer"></div>
    <div id="interimBox" class="interim"></div>
  </div>

  <!-- 右側：AI要約表示＆ダウンロードエリア -->
  <div id="right-panel">
    <h2>会議のAI要約</h2>
    <div class="btn-group">
      <button id="dlTxtBtn">要約をTXTで保存</button>
      <button id="dlMdBtn">要約をMarkdownで保存</button>
    </div>
    <div id="summaryBox">要約を待機中...</div>
    <div id="updateTime"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onChildAdded, onValue, onChildRemoved } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 1. Firebase 初期化
    const firebaseConfig = {
      databaseURL: "https://caption-db-cbff9-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentSummaryText = "";
    const logContainer = document.getElementById('logContainer');
    const interimBox = document.getElementById('interimBox');
    const summaryBox = document.getElementById('summaryBox');
    const updateTime = document.getElementById('updateTime');

    // 2. 確定ログ (transcripts/list) の取得（日時表示追加）
    const listRef = ref(db, 'transcripts/list');
    onChildAdded(listRef, (snapshot) => {
      const data = snapshot.val();
      if (data && data.content) {
        const div = document.createElement('div');
        div.className = 'log-item';
        
        // タイムスタンプの取得（timestamp, createdAt, time等のキーに対応。無い場合は現在時刻）
        const rawTime = data.timestamp || data.createdAt || data.time;
        const timeObj = rawTime ? new Date(rawTime) : new Date();
        const timeStr = timeObj.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        div.innerHTML = `<span class="timestamp">[${timeStr}]</span>${data.content}`;
        logContainer.appendChild(div);
        
        // 常に最新メッセージが見えるように自動スクロール
        logContainer.scrollTop = logContainer.scrollHeight;
      }
    });

    // 3. 送信側で「ログ消去」が実行された場合のみ画面表示をクリア
    onChildRemoved(listRef, () => {
      logContainer.innerHTML = '';
      interimBox.innerText = '';
      summaryBox.innerText = '要約データはまだありません。';
      updateTime.innerText = '';
      currentSummaryText = '';
    });

    // 4. 途中経過 (transcripts/interim) のリアルタイム受信
    const interimRef = ref(db, 'transcripts/interim');
    onValue(interimRef, (snapshot) => {
      const data = snapshot.val();
      if (data && data.content) {
        interimBox.innerText = `[発話中...] ${data.content}`;
      } else {
        interimBox.innerText = '';
      }
    });

    // 5. 要約データ (transcripts/summary) のリアルタイム受信
    const summaryRef = ref(db, 'transcripts/summary');
    onValue(summaryRef, (snapshot) => {
      const data = snapshot.val();
      if (data && data.text) {
        currentSummaryText = data.text;
        summaryBox.innerText = data.text;
        
        const dateStr = new Date(data.updatedAt).toLocaleTimeString('ja-JP');
        updateTime.innerText = `最終要約更新: ${dateStr}`;
      } else {
        summaryBox.innerText = '要約データはまだありません。';
        updateTime.innerText = '';
        currentSummaryText = "";
      }
    });

    // 共通のファイルダウンロード関数
    function downloadFile(content, fileName, mimeType) {
      const blob = new Blob([content], { type: `${mimeType};charset=utf-8;` });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // 6. 字幕ログの保存処理（日時も一緒に保存）
    function downloadLog(format) {
      const items = Array.from(logContainer.querySelectorAll('.log-item'));
      if (items.length === 0) {
        alert('保存できる字幕ログがありません。');
        return;
      }

      const now = new Date();
      const datePrefix = now.toISOString().split('T')[0];
      const logTexts = items.map(el => el.innerText);

      if (format === 'txt') {
        const textContent = logTexts.join('\n');
        downloadFile(textContent, `会議字幕ログ_${datePrefix}.txt`, 'text/plain');
      } else if (format === 'md') {
        const mdContent = `# 会議字幕ログ (${datePrefix})\n\n` + 
                          logTexts.map(t => `- ${t}`).join('\n') + 
                          `\n\n---\n*出力日時: ${now.toLocaleString('ja-JP')}*`;
        downloadFile(mdContent, `会議字幕ログ_${datePrefix}.md`, 'text/markdown');
      }
    }

    // 7. 要約の保存処理
    function downloadSummary(format) {
      if (!currentSummaryText) {
        alert('保存できる要約データがありません。');
        return;
      }

      const now = new Date();
      const datePrefix = now.toISOString().split('T')[0];

      if (format === 'txt') {
        downloadFile(currentSummaryText, `会議要約_${datePrefix}.txt`, 'text/plain');
      } else if (format === 'md') {
        const mdContent = `# 会議要約レポート (${datePrefix})\n\n${currentSummaryText}\n\n---\n*自動生成日時: ${now.toLocaleString('ja-JP')}*`;
        downloadFile(mdContent, `会議要約_${datePrefix}.md`, 'text/markdown');
      }
    }

    // イベントリスナーの登録
    document.getElementById('dlLogTxtBtn').addEventListener('click', () => downloadLog('txt'));
    document.getElementById('dlLogMdBtn').addEventListener('click', () => downloadLog('md'));
    document.getElementById('dlTxtBtn').addEventListener('click', () => downloadSummary('txt'));
    document.getElementById('dlMdBtn').addEventListener('click', () => downloadSummary('md'));
  </script>
</body>
</html>
