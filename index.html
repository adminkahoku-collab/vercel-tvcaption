<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム字幕 & 会議要約 表示画面</title>
  <style>
    body { 
      font-family: sans-serif; 
      padding: 20px; 
      background: #121212; 
      color: #fff; 
      margin: 0;
      box-sizing: border-box;
    }
    
    h2 { 
      border-bottom: 2px solid #333; 
      padding-bottom: 8px; 
      margin-top: 0;
      margin-bottom: 15px; 
      display: flex; 
      align-items: baseline; 
      gap: 10px; 
      font-size: 1.2rem;
    }

    .interval-badge { 
      font-size: 0.85rem; 
      color: #aaa; 
      font-weight: normal; 
    }

    /* 左右2カラムレイアウト用コンテナ */
    .container {
      display: flex;
      gap: 20px;
      height: calc(100vh - 40px);
    }

    /* カラムの基本構成 */
    .column {
      display: flex;
      flex-direction: column;
      background: #1e1e1e;
      padding: 18px;
      border-radius: 8px;
      border: 1px solid #333;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* 左右の比率設定 (字幕 7 : 要約 3) */
    .col-caption {
      flex: 7; /* 左側（字幕）の幅を広めに確保 */
    }

    .col-summary {
      flex: 3; /* 右側（要約）の幅 */
    }

    /* リアルタイム字幕用エリア */
    #interimArea { 
      color: #888; 
      font-style: italic; 
      margin-bottom: 10px; 
      min-height: 24px; 
      word-break: break-all;
    }

    #listArea { 
      flex: 1;
      overflow-y: auto; 
      display: flex; 
      flex-direction: column-reverse; 
      border-top: 1px solid #2a2a2a;
      padding-top: 10px;
    }

    .caption-item { 
      padding: 8px 0; 
      border-bottom: 1px solid #2a2a2a; 
      color: #e0e0e0; 
      line-height: 1.5;
      word-break: break-all;
    }

    /* 要約表示用エリア */
    #summaryArea { 
      flex: 1;
      overflow-y: auto;
      white-space: pre-wrap; 
      color: #00e676; 
      font-size: 1.05rem; 
      line-height: 1.8; 
      word-break: break-all;
    }

    .updated-time { 
      font-size: 0.8rem; 
      color: #666; 
      margin-top: 10px; 
      text-align: right; 
      border-top: 1px solid #2a2a2a;
      padding-top: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 左側：リアルタイム字幕 (幅 70%) -->
    <div class="column col-caption">
      <h2>リアルタイム字幕</h2>
      <div id="interimArea">[認識中...]</div>
      <div id="listArea">字幕ログを待機中...</div>
    </div>

    <!-- 右側：AI要約 (幅 30%) -->
    <div class="column col-summary">
      <h2>
        <span>会議のAI要約</span>
        <span id="intervalBadge" class="interval-badge">（※--分間隔で表示）</span>
      </h2>
      <div id="summaryArea">要約データを待機中...</div>
      <div id="updatedTime" class="updated-time"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://caption-db-cbff9-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const summaryArea = document.getElementById('summaryArea');
    const intervalBadge = document.getElementById('intervalBadge');
    const updatedTime = document.getElementById('updatedTime');
    const interimArea = document.getElementById('interimArea');
    const listArea = document.getElementById('listArea');

    // 1. AI要約の受信処理（間隔分数も自動取得してヘッダー表示）
    onValue(ref(db, 'transcripts/summary'), (snapshot) => {
      const data = snapshot.val();
      if (data && data.text) {
        const mins = data.intervalMinutes || 20;
        intervalBadge.textContent = `（※${mins}分間隔で表示）`;

        let cleanText = data.text
          .replace(/^###\s*/gm, '')
          .replace(/\*\*/g, '');

        summaryArea.textContent = cleanText;

        if (data.updatedAt) {
          const timeStr = new Date(data.updatedAt).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          updatedTime.textContent = `最終更新: ${timeStr}`;
        }
      } else {
        summaryArea.textContent = 'まだ要約は生成されていません。';
      }
    });

    // 2. 認識中テキスト（interim）の受信
    onValue(ref(db, 'transcripts/interim'), (snapshot) => {
      const data = snapshot.val();
      if (data && data.content) {
        interimArea.textContent = `[認識中...] ${data.content}`;
      } else {
        interimArea.textContent = '';
      }
    });

    // 3. 確定字幕リスト（list）の受信
    onValue(ref(db, 'transcripts/list'), (snapshot) => {
      const data = snapshot.val();
      if (data) {
        const items = Object.values(data);
        listArea.innerHTML = items.map(item => `<div class="caption-item">${item.content}</div>`).join('');
      } else {
        listArea.innerHTML = '字幕ログはありません。';
      }
    });
  </script>
</body>
</html>
