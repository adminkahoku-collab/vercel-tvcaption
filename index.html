<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>リアルタイム字幕・AI要約閲覧</title>
  <style>
    body { display: flex; font-family: sans-serif; margin: 0; padding: 10px; height: 100vh; box-sizing: border-box; }
    #left-panel { flex: 2; padding-right: 15px; border-right: 2px solid #ccc; overflow-y: auto; display: flex; flex-direction: column; }
    #right-panel { flex: 1; padding-left: 15px; overflow-y: auto; background-color: #f9f9f9; }
    #logContainer { flex-grow: 1; }
    .log-item { margin-bottom: 8px; border-bottom: 1px dashed #eee; padding-bottom: 4px; line-height: 1.5; }
    .interim { color: #888; font-style: italic; margin-top: 10px; min-height: 1.5em; }
    #summaryBox { white-space: pre-wrap; background: #fff; padding: 10px; border: 1px solid #ddd; border-radius: 4px; min-height: 200px; }
    .btn-group { margin-bottom: 10px; }
    button { padding: 6px 12px; margin-right: 5px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- 左側：リアルタイム字幕表示エリア -->
  <div id="left-panel">
    <h2>リアルタイム字幕</h2>
    <div id="logContainer"></div>
    <div id="interimBox" class="interim"></div>
  </div>

  <!-- 右側：AI要約表示＆ダウンロードエリア -->
  <div id="right-panel">
    <h2>会議のAI要約</h2>
    <div class="btn-group">
      <button id="dlTxtBtn">要約をTXTで保存</button>
      <button id="dlMdBtn">要約をMarkdownで保存</button>
    </div>
    <div id="summaryBox">要約を待機中...</div>
    <p style="font-size:12px; color:#666;" id="updateTime"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onChildAdded, onValue, onChildRemoved } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 1. Firebase 初期化
    const firebaseConfig = {
      databaseURL: "https://caption-db-cbff9-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentSummaryText = "";
    const logContainer = document.getElementById('logContainer');
    const interimBox = document.getElementById('interimBox');
    const summaryBox = document.getElementById('summaryBox');
    const updateTime = document.getElementById('updateTime');
    const leftPanel = document.getElementById('left-panel');

    // 2. 確定ログ (transcripts/list) のリアルタイム追加受信
    const listRef = ref(db, 'transcripts/list');
    onChildAdded(listRef, (snapshot) => {
      const data = snapshot.val();
      if (data && data.content) {
        const div = document.createElement('div');
        div.className = 'log-item';
        div.innerText = data.content;
        logContainer.appendChild(div);
        
        // 常に最新の発言が見えるよう一番下にスクロール
        leftPanel.scrollTop = leftPanel.scrollHeight;
      }
    });

    // 3. 送信側で「ログ消去」が実行された場合のみ画面の確定ログをクリア
    onChildRemoved(listRef, () => {
      // リスト内の要素が削除された（全削除等）際に画面もリフレッシュ
      if (logContainer.children.length > 0) {
        logContainer.innerHTML = '';
      }
    });

    // 4. 途中経過 (transcripts/interim) のリアルタイム受信
    const interimRef = ref(db, 'transcripts/interim');
    onValue(interimRef, (snapshot) => {
      const data = snapshot.val();
      if (data && data.content) {
        interimBox.innerText = `[発話中...] ${data.content}`;
      } else {
        interimBox.innerText = '';
      }
    });

    // 5. 要約データ (transcripts/summary) のリアルタイム受信
    const summaryRef = ref(db, 'transcripts/summary');
    onValue(summaryRef, (snapshot) => {
      const data = snapshot.val();
      if (data && data.text) {
        currentSummaryText = data.text;
        summaryBox.innerText = data.text;
        
        const dateStr = new Date(data.updatedAt).toLocaleTimeString('ja-JP');
        updateTime.innerText = `最終要約更新: ${dateStr}`;
      } else {
        summaryBox.innerText = '要約データはまだありません。';
        updateTime.innerText = '';
        currentSummaryText = "";
      }
    });

    // 6. ダウンロード機能
    function downloadSummary(format) {
      if (!currentSummaryText) {
        alert('保存できる要約データがありません。');
        return;
      }

      const now = new Date();
      const datePrefix = now.toISOString().split('T')[0];
      const fileName = `会議要約_${datePrefix}.${format}`;
      
      let fileContent = currentSummaryText;
      let mimeType = 'text/plain';

      if (format === 'md') {
        fileContent = `# 会議要約レポート (${datePrefix})\n\n${currentSummaryText}\n\n---\n*自動生成日時: ${now.toLocaleString('ja-JP')}*`;
        mimeType = 'text/markdown';
      }

      const blob = new Blob([fileContent], { type: `${mimeType};charset=utf-8;` });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    document.getElementById('dlTxtBtn').addEventListener('click', () => downloadSummary('txt'));
    document.getElementById('dlMdBtn').addEventListener('click', () => downloadSummary('md'));
  </script>
</body>
</html>
