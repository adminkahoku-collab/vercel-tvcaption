<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>リアルタイム字幕 Sender (エラー回避・安定版)</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #222; color: #fff; }
    button { padding: 10px 20px; font-size: 1rem; margin-right: 10px; margin-bottom: 10px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 15px; font-weight: bold; }
    .preview { margin-top: 15px; padding: 10px; border: 1px solid #555; background: #333; min-height: 50px; line-height: 1.5; }
    .error-log { margin-top: 15px; padding: 10px; border: 1px solid #f44336; background: #300; color: #ff8a80; font-size: 0.85rem; display: none; }
  </style>
</head>
<body>

  <h2>音声認識 送信画面 (エラー回避・安定版)</h2>

  <div>
    <button id="startBtn">認識＆送信開始</button>
    <button id="stopBtn" disabled>停止</button>
    <button id="summaryBtn">今すぐ要約作成</button>
    <button id="clearBtn">ログ消去</button>
  </div>

  <div class="status">ステータス: <span id="status" style="color: #ff5252;">停止中</span></div>

  <div class="preview" id="previewArea">ここに認識されたテキストが表示されます...</div>
  <div class="error-log" id="errorLog"></div>

  <script type="module">
    // エラーハンドラ（画面上にエラーを表示）
    function showError(msg) {
      console.error(msg);
      const errEl = document.getElementById('errorLog');
      if (errEl) {
        errEl.style.display = 'block';
        errEl.textContent = '【システムエラー】 ' + msg;
      }
    }

    window.addEventListener('error', (e) => showError(e.message));
    window.addEventListener('unhandledrejection', (e) => showError(e.reason));

    // Firebase SDK の読み込み
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, remove, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://caption-db-cbff9-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    let app, db;
    try {
      app = initializeApp(firebaseConfig);
      db = getDatabase(app);
    } catch (e) {
      showError("Firebase初期化失敗: " + e.message);
    }

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const clearBtn = document.getElementById('clearBtn');
    const summaryBtn = document.getElementById('summaryBtn');
    const statusEl = document.getElementById('status');
    const previewArea = document.getElementById('previewArea');

    let recognition = null;
    let isExplicitlyStopped = false;
    let interimTimer = null;
    let forceFinalTimer = null;
    let lastInterimText = '';
    let lastSentFinalText = '';

    let isSummarizing = false;
    let pauseTimer = null;
    let lastSummaryLength = 0;
    let lastSummaryTime = 0;
    const PAUSE_DELAY_MS = 15000;
    const MIN_INTERVAL_MS = 30000;
    const MIN_CHAR_DIFF = 100;

    // AI校正
    async function correctTextWithGemini(text) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000);

        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: controller.signal,
          body: JSON.stringify({
            prompt: `以下の音声認識テキストから「ええ」「ああ」「あのー」「えーっと」などの不要な言い淀みや相槌を除去し、同音異義語・誤字を修整して自然な日本語に補正してください。余計な解説や挨拶は一切出力せず、補正後のテキストのみを出力してください。\n\n【テキスト】\n${text}`
          })
        });
        clearTimeout(timeoutId);

        if (!response.ok) throw new Error(`API HTTP Error: ${response.status}`);
        const data = await response.json();
        return data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || text;
      } catch (err) {
        return text; // エラー時は原文を返す
      }
    }

// デバッグ強化版 要約処理
    async function generateSummary(isManual = false) {
      console.log('--- 1. 要約ボタンが押されました (isManual:', isManual, ') ---');

      if (isSummarizing) {
        console.warn('すでに要約処理が実行中のためスキップします。');
        return;
      }
      if (!db) {
        console.error('Firebase DBが初期化されていません。');
        alert('データベース接続エラー');
        return;
      }

      try {
        console.log('--- 2. Firebaseからログを取得中... ---');
        const listRef = ref(db, 'transcripts/list');
        
        // get() に 5秒のタイムアウトを設定
        const timeoutPromise = new Promise((_, reject) => 
          setTimeout(() => reject(new Error('Firebase読み込みタイムアウト')), 5000)
        );
        
        const snapshot = await Promise.race([get(listRef), timeoutPromise]);
        console.log('--- 3. Firebaseログ取得成功 ---');

        if (!snapshot.exists()) {
          console.warn('Firebaseに transcripts/list データが存在しません。');
          alert('要約対象の字幕ログがまだありません。声を吹き込んでから試してください。');
          return;
        }

        const data = snapshot.val();
        const logs = Object.values(data).map(item => item.content);
        const fullText = logs.join('\n');
        console.log('取得したテキスト全件 (文字数:', fullText.length, '):', fullText);

        isSummarizing = true;
        statusEl.textContent = 'AI要約生成中...';
        statusEl.style.color = '#ffb300';

        console.log('--- 4. Vercel API (/api/chat) へ送信中... ---');
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: `以下は会議のログです。全体の内容を整理し、主要な話題、決定事項、重要なやり取りを箇条書きで簡潔に要約してください。\n\n【発言ログ】\n${fullText}`
          })
        });

        console.log('--- 5. APIレスポンス受信 ステータス:', response.status, '---');

        if (!response.ok) {
          throw new Error(`APIエラー: HTTP ${response.status}`);
        }

        const resData = await response.json();
        console.log('--- 6. API返却データ:', resData, '---');

        // ★ エラーオブジェクトが返ってきたら中身を文字列にして表示する
        if (resData.error) {
          const detailMsg = typeof resData.error === 'object' 
            ? (resData.error.message || JSON.stringify(resData.error)) 
            : resData.error;
          console.error('Gemini詳細エラー:', detailMsg);
          showError(`AIエラー詳細: ${detailMsg}`);
          return;
        }        
        
        const summaryResult = (
          resData.candidates?.[0]?.content?.parts?.[0]?.text ||
          resData.text ||
          resData.content ||
          resData.message ||
          (typeof resData === 'string' ? resData : '')
        ).trim();

        if (summaryResult) {
          console.log('--- 7. Firebase transcripts/summary へ書き込み中... ---');
          await set(ref(db, 'transcripts/summary'), {
            text: summaryResult,
            updatedAt: Date.now()
          });
          
          lastSummaryLength = fullText.length;
          lastSummaryTime = Date.now();
          console.log('✅ 【成功】要約の保存が完了しました！');
          alert('要約の作成と保存に成功しました！');
        } else {
          console.error('❌ AIの要約結果が空でした。');
          showError('AIの要約結果が空でした。');
        }
      } catch (err) {
        console.error('❌ 要約処理中にエラー発生:', err);
        showError("要約作成エラー: " + err.message);
      } finally {
        isSummarizing = false;
        statusEl.textContent = isExplicitlyStopped ? '停止中' : '認識中（AI要約モード）';
        statusEl.style.color = isExplicitlyStopped ? '#ff5252' : '#00e676';
      }
    }
    
    function resetPauseTimer() {
      clearTimeout(pauseTimer);
      pauseTimer = setTimeout(() => generateSummary(false), PAUSE_DELAY_MS);
    }

    async function processAndSend(text, isInterim = false) {
      const trimmedText = text ? text.trim() : '';
      if (!trimmedText || !db) return;

      if (isInterim) {
        await set(ref(db, 'transcripts/interim'), {
          content: trimmedText,
          timestamp: Date.now()
        });
        updatePreview(`[認識中...] ${trimmedText}`, true);
      } else {
        if (trimmedText === lastSentFinalText) {
          await remove(ref(db, 'transcripts/interim'));
          return;
        }

        lastSentFinalText = trimmedText;
        await remove(ref(db, 'transcripts/interim'));

        const listRef = ref(db, 'transcripts/list');
        const newRef = push(listRef);
        await set(newRef, {
          content: trimmedText,
          timestamp: Date.now()
        });
        updatePreview(`[確定] ${trimmedText}`, false);

        correctTextWithGemini(trimmedText).then(async (correctedText) => {
          if (correctedText && correctedText !== trimmedText) {
            await set(newRef, {
              content: correctedText,
              timestamp: Date.now()
            });
            updatePreview(`[補正済] ${correctedText}`, false);
          }
        });

        resetPauseTimer();
      }
    }

    function updatePreview(msg, isInterim) {
      previewArea.textContent = msg;
      previewArea.style.color = isInterim ? '#aaa' : '#00e676';
    }

    // Web Speech API の初期化
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = () => { 
        statusEl.textContent = '認識中（AI要約モード）'; 
        statusEl.style.color = '#00e676';
      };
      
      recognition.onend = () => { 
        if (lastInterimText.trim() !== '') {
          processAndSend(lastInterimText, false);
          lastInterimText = '';
        }
        if (!isExplicitlyStopped) {
          try { recognition.start(); } catch(e){}
        } else {
          statusEl.textContent = '停止中';
          statusEl.style.color = '#ff5252';
        }
      };

      recognition.onresult = (event) => {
        let interimText = '';
        let currentFinal = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            currentFinal += event.results[i][0].transcript;
          } else {
            interimText += event.results[i][0].transcript;
          }
        }

        clearTimeout(interimTimer);
        clearTimeout(forceFinalTimer);

        if (currentFinal !== '') {
          lastInterimText = '';
          processAndSend(currentFinal, false);
        } else if (interimText !== '') {
          lastInterimText = interimText;
          interimTimer = setTimeout(() => processAndSend(interimText, true), 300);
          forceFinalTimer = setTimeout(() => {
            if (lastInterimText.trim() !== '') {
              processAndSend(lastInterimText, false);
              lastInterimText = '';
            }
          }, 2500);
        }
      };
    } else {
      showError("お使いのブラウザは音声認識機能に対応していません。Google Chrome をご使用ください。");
    }

    // --- ボタンイベントのバインド ---
    startBtn.addEventListener('click', () => {
      if (!recognition) {
        alert('音声認識が初期化されていません。Google Chrome で開いているか確認してください。');
        return;
      }
      isExplicitlyStopped = false;
      lastSentFinalText = '';
      try {
        recognition.start();
        startBtn.disabled = true;
        stopBtn.disabled = false;
      } catch (e) {
        showError("認識開始エラー: " + e.message);
      }
    });

    stopBtn.addEventListener('click', () => {
      if (!recognition) return;
      isExplicitlyStopped = true;
      clearTimeout(interimTimer);
      clearTimeout(forceFinalTimer);
      clearTimeout(pauseTimer);
      
      if (lastInterimText.trim() !== '') {
        processAndSend(lastInterimText, false);
        lastInterimText = '';
      }

      recognition.stop();
      startBtn.disabled = false;
      stopBtn.disabled = true;
    });

    summaryBtn.addEventListener('click', () => generateSummary(true));

    clearBtn.addEventListener('click', async () => {
      if (!db) {
        alert('データベースに接続できていません。');
        return;
      }
      if (confirm('すべての字幕ログと要約を削除しますか？')) {
        try {
          await remove(ref(db, 'transcripts'));
          lastInterimText = '';
          lastSentFinalText = '';
          lastSummaryLength = 0;
          clearTimeout(pauseTimer);
          previewArea.textContent = 'ログと要約をクリアしました。';
          previewArea.style.color = '#888';
          alert('消去が完了しました。');
        } catch (error) {
          showError("ログ消去エラー: " + error.message);
        }
      }
    });
  </script>
</body>
</html>
