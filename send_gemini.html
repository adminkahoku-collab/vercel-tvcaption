<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>音声入力・AI補正＆非同期要約送信</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <h2>音声入力 (AI補正＆非同期要約モード)</h2>
  <button id="startBtn" onclick="startRecognition()">認識＆送信開始</button>
  <button id="stopBtn" onclick="stopRecognition()" disabled>停止</button>
  <button onclick="clearLogs()">ログ消去</button>
  <p>ステータス: <span id="status">停止中</span></p>

  <script>
    // --------------------------------------------------
    // 1. Firebase 初期化設定 (ご自身の環境設定に合わせてください)
    // --------------------------------------------------
    const firebaseConfig = {
      databaseURL: "https://<YOUR-FIREBASE-APP>.firebaseio.com"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // --------------------------------------------------
    // 2. 設定値・状態変数 (APIキー変数は削除しました)
    // --------------------------------------------------
    const SUMMARY_INTERVAL_MS = 60000; // API制限保護: 要約実行は最低60秒間隔
    let lastSummaryTime = 0;
    let isSummarizing = false; // 要約処理中フラグ
    let recentLogs = []; // 要約用ログバッファ（直近のログを保持）

    // --------------------------------------------------
    // 3. Web Speech API (音声認識) のセットアップ
    // --------------------------------------------------
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'ja-JP';
    recognition.interimResults = true;
    recognition.continuous = true;

    let isStarted = false;

    recognition.onresult = async (event) => {
      let interimTranscript = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          // --- 確定テキストの送信処理 ---
          // ① まず原稿・補正テキストを即時送信（Vercelの /api/chat 経由で補正）
          const correctedText = await correctTextWithGemini(transcript);
          saveTranscript(correctedText);
          
          // ② 要約用バッファに追記
          recentLogs.push(correctedText);
          if (recentLogs.length > 50) recentLogs.shift(); // 最新50件のみ保持

          // ③ 非同期要約チェック（並行処理）
          triggerAsyncSummary();

        } else {
          interimTranscript += transcript;
        }
      }
      // 途中経過を interim ノードに上書き送信
      if (interimTranscript) {
        db.ref('transcripts/interim').set({
          content: interimTranscript,
          timestamp: Date.now()
        });
      }
    };

    recognition.onend = () => {
      if (isStarted) recognition.start(); // 自動再接続
    };

    function startRecognition() {
      isStarted = true;
      recognition.start();
      document.getElementById('status').innerText = '認識中...';
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
    }

    function stopRecognition() {
      isStarted = false;
      recognition.stop();
      document.getElementById('status').innerText = '停止中';
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
    }

    // --------------------------------------------------
    // 4. Firebaseへの文字起こし保存 (即時送信)
    // --------------------------------------------------
    function saveTranscript(text) {
      db.ref('transcripts/list').push({
        content: text,
        timestamp: Date.now()
      });
      db.ref('transcripts/interim').remove(); // 仮ノードクリア
    }

    // --------------------------------------------------
    // 5. Vercel API Route (/api/chat) によるテキスト校正
    // --------------------------------------------------
    async function correctTextWithGemini(text) {
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: `以下の音声認識テキストの同音異義語・誤字を修整し、自然な日本語に補正してください。余計な解説は出力せず補正結果のみ返してください。\n\n【テキスト】\n${text}`
          })
        });
        const data = await response.json();
        return data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || text;
      } catch (err) {
        console.warn('Vercel API Correction Error:', err);
        return text; // エラー時は原文をそのまま返す
      }
    }

    // --------------------------------------------------
    // 6. 非同期要約生成ロジック (タイマーガード付 & /api/chat 利用)
    // --------------------------------------------------
    function triggerAsyncSummary() {
      const now = Date.now();
      // 前回から60秒以上経過 ＆＆ 現在要約処理中でない ＆＆ ログが存在する場合のみ実行
      if (now - lastSummaryTime >= SUMMARY_INTERVAL_MS && !isSummarizing && recentLogs.length > 0) {
        lastSummaryTime = now;
        isSummarizing = true;

        // 非同期 (Promise) で実行し、文字起こし送信をブロックしない
        generateSummaryAsync(recentLogs.slice()).finally(() => {
          isSummarizing = false;
        });
      }
    }

    async function generateSummaryAsync(logsToSummarize) {
      const promptText = `以下は会議の直近の発言ログです。会議の要点、決定事項、主要な質疑応答（特に予算関連の「款・項・目」やページ数など）を箇条書きで簡潔に要約してください。\n\n【発言ログ】\n${logsToSummarize.join('\n')}`;

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: promptText })
        });
        const data = await response.json();
        const summaryResult = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();

        if (summaryResult) {
          // Firebase の `transcripts/summary` ノードを上書き更新
          await db.ref('transcripts/summary').set({
            text: summaryResult,
            updatedAt: Date.now()
          });
          console.log('要約をFirebaseへ自動更新しました');
        }
      } catch (err) {
        console.error('Vercel API Summary Error:', err);
      }
    }

    function clearLogs() {
      if (confirm('全てのログと要約を消去しますか？')) {
        db.ref('transcripts').remove();
        recentLogs = [];
        alert('消去完了しました');
      }
    }
  </script>
</body>
</html>
