<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム字幕 & 自動要約 送信画面 (履歴追加・Ollama版)</title>
  <style>
    body { 
      font-family: sans-serif; 
      padding: 20px; 
      background: #1e1e1e; 
      color: #fff; 
      margin: 0; 
      box-sizing: border-box;
      width: 100%;
    }
    h2 { margin-top: 0; margin-bottom: 15px; border-bottom: 2px solid #444; padding-bottom: 8px; }
    
    .control-panel { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .setting-group { margin-bottom: 12px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .setting-item { display: flex; align-items: center; gap: 6px; }
    label { font-size: 0.9rem; color: #ccc; font-weight: bold; }
    select { padding: 6px 12px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; font-size: 0.9rem; }
    
    button { padding: 10px 18px; font-size: 0.95rem; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; transition: background 0.2s; margin-right: 8px; margin-bottom: 6px; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #startBtn { background: #00c853; color: #fff; }
    #startBtn:hover:not(:disabled) { background: #00e676; }
    #stopBtn { background: #d50000; color: #fff; }
    #stopBtn:hover:not(:disabled) { background: #ff1744; }
    #forceSummaryBtn { background: #1976d2; color: #fff; }
    #forceSummaryBtn:hover:not(:disabled) { background: #2196f3; }
    #clearBtn { background: #616161; color: #fff; }
    #clearBtn:hover:not(:disabled) { background: #757575; }

    .status { margin-top: 12px; font-weight: bold; font-size: 0.95rem; }
    .summary-status { margin-top: 6px; font-size: 0.85rem; color: #81d4fa; }
    
    .preview { 
      margin-top: 15px; 
      padding: 15px; 
      border: 1px solid #444; 
      background: #2b2b2b; 
      min-height: 120px; 
      border-radius: 6px; 
      line-height: 1.6; 
      word-break: break-all; 
      font-size: 1.1rem;
      width: 100%;
      box-sizing: border-box;
    }
    .interim { color: #aaa; font-style: italic; }
    .buffering { color: #ffd54f; }
    .final { color: #00e676; font-weight: bold; }
    
    .error-log { margin-top: 15px; padding: 10px 15px; border: 1px solid #ff5252; background: #3c1616; color: #ff8a80; border-radius: 6px; font-size: 0.85rem; display: none; }
  </style>
</head>
<body>

  <h2>音声認識 & ローカルAI自動要約 送信画面</h2>

  <div class="control-panel">
    <div class="setting-group">
      <div class="setting-item">
        <label for="engineSelect">動作モード:</label>
        <select id="engineSelect">
          <option value="edge" selected>【標準モード】 Edge (要約あり・言い淀み自動カット)</option>
          <option value="chrome">【標準モード】 Chrome (要約あり・原稿優先)</option>
          <option value="direct">【高速ダイレクト】 無加工送信（要約なし・タイムラグ最小）</option>
        </select>
      </div>

      <div class="setting-item">
        <label for="bufferWaitSelect">単語結合待ち:</label>
        <select id="bufferWaitSelect">
          <option value="0">0秒 (結合なし・即確定)</option>
          <option value="1500">1.5秒 (短め)</option>
          <option value="2500">2.5秒 (標準・文節結合)</option>
          <option value="4000" selected>4.0秒 (長文まとめ)</option>
        </select>
      </div>
    </div>

    <div>
      <button id="startBtn">認識＆送信開始</button>
      <button id="stopBtn" disabled>停止</button>
      <button id="forceSummaryBtn">今すぐ要約を追加</button>
      <button id="clearBtn">ログ消去</button>
    </div>

    <div class="status">認識ステータス: <span id="status" style="color: #ff5252;">停止中</span></div>
    <div class="summary-status">ローカルAI要約 (qwen2.5:3b): <span id="summaryStatus">待機中（5分間隔・追記型）</span></div>
  </div>

  <div class="preview" id="previewArea">ここに認識された字幕が表示されます...</div>
  <div class="error-log" id="errorLog"></div>

  <script type="module">
    function showError(msg) {
      console.error(msg);
      const errEl = document.getElementById('errorLog');
      if (errEl) {
        errEl.style.display = 'block';
        errEl.textContent = '【システム通知】 ' + msg;
      }
    }

    function clearError() {
      const errEl = document.getElementById('errorLog');
      if (errEl) errEl.style.display = 'none';
    }

    window.addEventListener('error', (e) => showError(e.message));
    window.addEventListener('unhandledrejection', (e) => showError(e.reason));

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, remove, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://caption-db-cbff9-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    let app, db;
    try {
      app = initializeApp(firebaseConfig);
      db = getDatabase(app);
    } catch (e) {
      showError("Firebase初期化失敗: " + e.message);
    }

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const forceSummaryBtn = document.getElementById('forceSummaryBtn');
    const clearBtn = document.getElementById('clearBtn');
    const engineSelect = document.getElementById('engineSelect');
    const bufferWaitSelect = document.getElementById('bufferWaitSelect');
    const statusEl = document.getElementById('status');
    const summaryStatusEl = document.getElementById('summaryStatus');
    const previewArea = document.getElementById('previewArea');

    // ====================================================
    // Ollama 設定エリア（16GBメモリ・CPU推論向け最適化）
    // ====================================================
    const OLLAMA_API_URL = "http://localhost:11434/api/generate";
    const OLLAMA_MODEL = "qwen2.5:3b";
    const SUMMARY_INTERVAL_MS = 3 * 60 * 1000; // 3分間隔
    const MIN_CHAR_DIFF = 40;                  // 新規発言が40文字以上増えたら要約実行
    // ====================================================

    let recognition = null;
    let isExplicitlyStopped = true;
    let lastSentFinalText = '';
    let lastInterimText = '';
    let isSummarizing = false;

    let finalBufferText = '';
    let bufferFlushTimer = null;
    const MAX_BUFFER_LENGTH = 60;

    let lastSummaryTime = 0;
    let lastSummarizedLogCount = 0; // 前回どこまでの発言を要約したかの件数インデックス
    const intervalMinutes = Math.floor(SUMMARY_INTERVAL_MS / (60 * 1000));

    engineSelect.value = 'edge';

    function cleanFillerText(text) {
      if (!text) return '';
      return text
        .replace(/^(えーっと|えー|あのー|あの|ええと|ええ|あー|うん|そのー|まあ)\s+/g, '')
        .replace(/\s+(えーっと|えー|あのー|あの|ええと|ええ|あー|うん|そのー|まあ)\s+/g, ' ')
        .trim();
    }

    async function flushFinalBuffer() {
      if (bufferFlushTimer) {
        clearTimeout(bufferFlushTimer);
        bufferFlushTimer = null;
      }

      const textToSend = finalBufferText.trim();
      finalBufferText = '';

      if (!textToSend || !db) return;

      if (textToSend === lastSentFinalText) {
        await remove(ref(db, 'transcripts/interim'));
        return;
      }

      lastSentFinalText = textToSend;
      await remove(ref(db, 'transcripts/interim'));

      const listRef = ref(db, 'transcripts/list');
      await push(listRef, {
        content: textToSend,
        timestamp: Date.now()
      });

      updatePreview(textToSend, 'final');
    }

    async function processAndSend(text, isInterim = false) {
      let processedText = text ? text.trim() : '';
      if (!processedText || !db) return;

      if (engineSelect.value === 'edge') {
        processedText = cleanFillerText(processedText);
        if (!processedText) return;
      }

      const waitMs = (engineSelect.value === 'direct') ? 0 : parseInt(bufferWaitSelect.value, 10);

      if (isInterim) {
        const displayInterim = finalBufferText 
          ? `${finalBufferText} ${processedText}` 
          : processedText;

        await set(ref(db, 'transcripts/interim'), {
          content: displayInterim,
          timestamp: Date.now()
        });
        updatePreview(displayInterim, 'interim');
      } else {
        if (waitMs <= 0) {
          finalBufferText = finalBufferText ? `${finalBufferText} ${processedText}` : processedText;
          await flushFinalBuffer();
        } else {
          finalBufferText = finalBufferText ? `${finalBufferText} ${processedText}` : processedText;

          await set(ref(db, 'transcripts/interim'), {
            content: finalBufferText,
            timestamp: Date.now()
          });
          updatePreview(finalBufferText, 'buffering');

          if (bufferFlushTimer) clearTimeout(bufferFlushTimer);

          if (finalBufferText.length >= MAX_BUFFER_LENGTH) {
            await flushFinalBuffer();
          } else {
            bufferFlushTimer = setTimeout(() => {
              flushFinalBuffer();
            }, waitMs);
          }
        }
      }
    }

    function updatePreview(text, state) {
      if (state === 'interim') {
        previewArea.textContent = `[認識中...] ${text}`;
        previewArea.className = 'preview interim';
      } else if (state === 'buffering') {
        previewArea.textContent = `[文節結合待ち...] ${text}`;
        previewArea.className = 'preview buffering';
      } else {
        previewArea.textContent = `[確定送信済] ${text}`;
        previewArea.className = 'preview final';
      }
    }

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = () => { 
        const modeLabel = engineSelect.options[engineSelect.selectedIndex].text;
        statusEl.textContent = `認識中 (${modeLabel})`; 
        statusEl.style.color = '#00e676';
        startBtn.disabled = true;
        stopBtn.disabled = false;
        clearError();
      };

      recognition.onend = async () => { 
        if (lastInterimText.trim() !== '') {
          await processAndSend(lastInterimText, false);
          lastInterimText = '';
        }

        if (!isExplicitlyStopped) {
          setTimeout(() => {
            try { 
              recognition.start(); 
            } catch(e) {
              console.warn("再接続試行中...", e);
            }
          }, 100);
        } else {
          await flushFinalBuffer();
          statusEl.textContent = '停止中';
          statusEl.style.color = '#ff5252';
          startBtn.disabled = false;
          stopBtn.disabled = true;
        }
      };

      recognition.onerror = (event) => {
        if (event.error === 'not-allowed') {
          showError("マイクへのアクセス権限が拒否されています。ブラウザの設定でマイクを許可してください。");
          isExplicitlyStopped = true;
        } else if (event.error !== 'no-speech') {
          console.warn("音声認識イベント通知:", event.error);
        }
      };

      recognition.onresult = (event) => {
        let interimText = '';
        let finalText = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          const res = event.results[i];
          if (res.isFinal) {
            finalText += res[0].transcript;
          } else {
            interimText += res[0].transcript;
          }
        }

        if (finalText !== '') {
          lastInterimText = '';
          processAndSend(finalText, false);
        } else if (interimText !== '') {
          lastInterimText = interimText;
          processAndSend(interimText, true);
        }
      };
    } else {
      showError("お使いのブラウザは Web Speech API 非対応です。Chrome または Edge を使用してください。");
    }

    // 差分ログのみを要約して transcripts/summary_list へ追加 (push) する関数
    async function autoGenerateSummary(force = false) {
      if (!force && engineSelect.value === 'direct') return;
      if (isSummarizing || !db) return;
      if (!force && isExplicitlyStopped) return;

      const now = Date.now();
      if (!force && lastSummaryTime > 0 && (now - lastSummaryTime < SUMMARY_INTERVAL_MS)) return;

      try {
        const listRef = ref(db, 'transcripts/list');
        const snapshot = await get(listRef);
        
        if (!snapshot.exists()) {
          if (force) alert("要約対象の字幕ログがまだありません。");
          return;
        }

        const data = snapshot.val();
        const allItems = Object.values(data);

        // 前回要約済みの件数以降（新規発言のみ）を切り出す
        if (allItems.length <= lastSummarizedLogCount) {
          if (force) alert("前回の要約以降に新しい発言がありません。");
          return;
        }

        const newItems = allItems.slice(lastSummarizedLogCount);
        let diffText = newItems.map(item => item.content).join('\n');

        if (!force && diffText.trim().length < MIN_CHAR_DIFF) return;

        // 1回の処理文字数上限（CPU推論最適化のため3500文字まで）
        if (diffText.length > 3500) {
          diffText = diffText.slice(-3500);
        }

        // 区間時刻の生成（開始ログの時刻 〜 現在時刻）
        const startRawTime = newItems[0].timestamp || now;
        const startStr = new Date(startRawTime).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
        const endStr = new Date(now).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
        const timeRangeLabel = `${startStr}〜${endStr}`;

        isSummarizing = true;
        forceSummaryBtn.disabled = true;
        summaryStatusEl.textContent = `要約生成中... (${timeRangeLabel} 分を処理中)`;
        summaryStatusEl.style.color = "#ffd54f";

        const promptText = `あなたは議会の書記です。以下の文字起こしログから、議論の「要点」だけを短い箇条書きで抽出してください。

【厳守ルール】
1. 1項目につき「1行・30文字以内」の短い体言止め（または簡潔な文）にすること。
2. 原文の長い文章をそのままコピーしないこと。「えー」「まあ」などの話し言葉は完全に消すこと。
3. 音声認識の誤変換を文脈から正しい議会用語に直すこと（例：「三巻二項四目」「三冠以降にもく」「注目」→「3款2項4目」「3款1項2目」「10目」、「青果」→「成果」、「秋山」→「空き家」、「ご再検診」→「5歳児健診」）。
4. ページ数・款項目・金額・件数・理由は省略せず残すこと。
5. 出力は行頭の「・」のみを使い、見出しや前置きは一切書かないこと。

【文字起こしログ】
${diffText}`;

        const response = await fetch(OLLAMA_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: OLLAMA_MODEL,
            prompt: promptText,
            stream: false,
            options: {
              temperature: 0.1,
              num_ctx: 2048,    // ★ 3分間隔に合わせて4096→2048に縮小（CPU処理が速くなります）
              num_predict: 250  // ★ 長文ダラダラ出力を物理的に防止して高速化
            }
          })
        });

        if (!response.ok) {
          throw new Error(`Ollama接続エラー: HTTP ${response.status}`);
        }

        const resData = await response.json();
        const summaryResult = (resData.response || '').trim();

        if (summaryResult) {
          // 上書き(set)ではなく、履歴リストへ追加(push)する
          const summaryListRef = ref(db, 'transcripts/summary_list');
          await push(summaryListRef, {
            text: summaryResult,
            timeRange: timeRangeLabel,
            updatedAt: now,
            intervalMinutes: intervalMinutes
          });

          lastSummaryTime = now;
          lastSummarizedLogCount = allItems.length; // 処理済み件数を更新
          clearError();

          summaryStatusEl.textContent = `追加完了 (${timeRangeLabel} 分 / ${intervalMinutes}分間隔)`;
          summaryStatusEl.style.color = "#00e676";
        }

      } catch (err) {
        showError("ローカルAI要約エラー: " + err.message);
        summaryStatusEl.textContent = "エラー発生（システム通知を確認）";
        summaryStatusEl.style.color = "#ff5252";
      } finally {
        isSummarizing = false;
        forceSummaryBtn.disabled = false;
      }
    }

    // 30秒ごとにタイマーチェックを実行
    setInterval(() => {
      autoGenerateSummary(false);
    }, 30 * 1000);

    startBtn.addEventListener('click', () => {
      if (!recognition) {
        alert("音声認識機能が初期化されていません。対応ブラウザ（Chrome/Edge）でお試しください。");
        return;
      }
      isExplicitlyStopped = false;
      lastSentFinalText = '';
      finalBufferText = '';
      clearError();

      try {
        recognition.start();
      } catch (e) {
        console.warn("認識再起動処理中:", e.message);
        try {
          recognition.stop();
          setTimeout(() => recognition.start(), 200);
        } catch(err) {
          showError("認識起動失敗: " + err.message);
        }
      }
    });

    stopBtn.addEventListener('click', async () => {
      if (!recognition) return;
      isExplicitlyStopped = true;
      await flushFinalBuffer();
      try {
        recognition.stop();
      } catch(e){}
    });

    forceSummaryBtn.addEventListener('click', () => {
      autoGenerateSummary(true);
    });

    clearBtn.addEventListener('click', async () => {
      if (!db) return;
      if (confirm('すべての字幕ログおよび要約履歴を削除しますか？')) {
        try {
          if (bufferFlushTimer) clearTimeout(bufferFlushTimer);
          finalBufferText = '';
          await remove(ref(db, 'transcripts'));
          lastSentFinalText = '';
          lastSummaryTime = 0;
          lastSummarizedLogCount = 0;
          previewArea.textContent = 'ログと要約をクリアしました。';
          summaryStatusEl.textContent = `待機中（${intervalMinutes}分間隔・追記型）`;
          summaryStatusEl.style.color = "#81d4fa";
          alert('消去完了しました。');
          clearError();
        } catch (error) {
          showError("ログ消去エラー: " + error.message);
        }
      }
    });
  </script>
</body>
</html>
