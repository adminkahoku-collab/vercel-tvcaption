<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム字幕 & 自動要約 送信画面</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #1e1e1e; color: #fff; max-width: 900px; margin: 0 auto; }
    h2 { margin-bottom: 10px; border-bottom: 2px solid #444; padding-bottom: 8px; }
    
    .control-panel { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    .setting-group { margin-bottom: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    label { font-size: 0.9rem; color: #ccc; font-weight: bold; }
    select { padding: 6px 12px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; font-size: 0.9rem; }
    
    button { padding: 10px 18px; font-size: 0.95rem; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; transition: background 0.2s; margin-right: 8px; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #startBtn { background: #00c853; color: #fff; }
    #startBtn:hover:not(:disabled) { background: #00e676; }
    #stopBtn { background: #d50000; color: #fff; }
    #stopBtn:hover:not(:disabled) { background: #ff1744; }
    #clearBtn { background: #616161; color: #fff; }
    #clearBtn:hover:not(:disabled) { background: #757575; }

    .status { margin-top: 12px; font-weight: bold; font-size: 0.95rem; }
    .preview { margin-top: 15px; padding: 12px; border: 1px solid #444; background: #2b2b2b; min-height: 60px; border-radius: 6px; line-height: 1.6; word-break: break-all; }
    .interim { color: #888; font-style: italic; }
    .final { color: #00e676; font-weight: bold; }
    
    .error-log { margin-top: 15px; padding: 10px 15px; border: 1px solid #ff5252; background: #3c1616; color: #ff8a80; border-radius: 6px; font-size: 0.85rem; display: none; }
  </style>
</head>
<body>

  <h2>音声認識 & 自動要約 送信画面</h2>

  <div class="control-panel">
    <div class="setting-group">
      <label for="engineSelect">音声処理モード:</label>
      <select id="engineSelect">
        <option value="chrome">Chrome モード (語彙・文脈優先)</option>
        <option value="edge">Edge モード (言い淀み自動カット)</option>
      </select>
    </div>

    <div>
      <button id="startBtn">認識＆送信開始</button>
      <button id="stopBtn" disabled>停止</button>
      <button id="clearBtn">ログ消去</button>
    </div>

    <div class="status">ステータス: <span id="status" style="color: #ff5252;">停止中</span></div>
  </div>

  <div class="preview" id="previewArea">ここに認識された字幕が表示されます...</div>
  <div class="error-log" id="errorLog"></div>

  <script type="module">
    function showError(msg) {
      console.error(msg);
      const errEl = document.getElementById('errorLog');
      if (errEl) {
        errEl.style.display = 'block';
        errEl.textContent = '【システム通知】 ' + msg;
      }
    }

    function clearError() {
      const errEl = document.getElementById('errorLog');
      if (errEl) errEl.style.display = 'none';
    }

    window.addEventListener('error', (e) => showError(e.message));
    window.addEventListener('unhandledrejection', (e) => showError(e.reason));

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, remove, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://caption-db-cbff9-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    let app, db;
    try {
      app = initializeApp(firebaseConfig);
      db = getDatabase(app);
    } catch (e) {
      showError("Firebase初期化失敗: " + e.message);
    }

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const clearBtn = document.getElementById('clearBtn');
    const engineSelect = document.getElementById('engineSelect');
    const statusEl = document.getElementById('status');
    const previewArea = document.getElementById('previewArea');

    let recognition = null;
    let isExplicitlyStopped = true;
    let lastSentFinalText = '';
    let isSummarizing = false;

    let lastSummaryTime = 0;
    let lastSummaryCharLength = 0;
    const SUMMARY_INTERVAL_MS = 20 * 60 * 1000; 
    const MIN_CHAR_DIFF = 50; 

    const userAgent = navigator.userAgent.toLowerCase();
    if (userAgent.includes('edg/')) {
      engineSelect.value = 'edge';
    } else {
      engineSelect.value = 'chrome';
    }

    function cleanFillerText(text) {
      if (!text) return '';
      return text
        .replace(/^(えーっと|えー|あのー|あの|ええと|ええ|あー|うん|そのー|まあ)\s*/g, '')
        .replace(/(えーっと|えー|あのー|あの|ええと|ええ|あー|うん|そのー|まあ)/g, '')
        .trim();
    }

    async function processAndSend(text, isInterim = false) {
      let processedText = text ? text.trim() : '';
      if (!processedText || !db) return;

      if (engineSelect.value === 'edge') {
        processedText = cleanFillerText(processedText);
        if (!processedText) return;
      }

      if (isInterim) {
        await set(ref(db, 'transcripts/interim'), {
          content: processedText,
          timestamp: Date.now()
        });
        updatePreview(processedText, true);
      } else {
        if (processedText === lastSentFinalText) {
          await remove(ref(db, 'transcripts/interim'));
          return;
        }

        lastSentFinalText = processedText;
        await remove(ref(db, 'transcripts/interim'));

        const listRef = ref(db, 'transcripts/list');
        await push(listRef, {
          content: processedText,
          timestamp: Date.now()
        });

        updatePreview(processedText, false);
      }
    }

    function updatePreview(text, isInterim) {
      if (isInterim) {
        previewArea.innerHTML = `<span class="interim">[認識中...] ${text}</span>`;
      } else {
        previewArea.innerHTML = `<span class="final">[確定] ${text}</span>`;
      }
    }

    // 音声認識の初期化
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = () => { 
        statusEl.textContent = '認識中 (自動バックグラウンド要約稼働中)'; 
        statusEl.style.color = '#00e676';
        startBtn.disabled = true;
        stopBtn.disabled = false;
        clearError();
      };

      recognition.onend = () => { 
        if (!isExplicitlyStopped) {
          try { 
            recognition.start(); 
          } catch(e) {
            console.warn("再接続試行中...", e);
          }
        } else {
          statusEl.textContent = '停止中';
          statusEl.style.color = '#ff5252';
          startBtn.disabled = false;
          stopBtn.disabled = true;
        }
      };

      recognition.onerror = (event) => {
        // マイク未許可や無音切断時の通知
        if (event.error === 'not-allowed') {
          showError("マイクへのアクセス権限が拒否されています。ブラウザの設定でマイクを許可してください。");
        } else if (event.error !== 'no-speech') {
          console.warn("音声認識イベント通知:", event.error);
        }
      };

      recognition.onresult = (event) => {
        let interimText = '';
        let finalText = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          const res = event.results[i];
          if (res.isFinal) {
            finalText += res[0].transcript;
          } else {
            interimText += res[0].transcript;
          }
        }

        if (finalText !== '') {
          processAndSend(finalText, false);
        } else if (interimText !== '') {
          processAndSend(interimText, true);
        }
      };
    } else {
      showError("お使いのブラウザは Web Speech API 非対応です。Chrome または Edge を使用してください。");
    }

// 自動要約の更新間隔（例: 20分）
const SUMMARY_INTERVAL_MS = 20 * 60 * 1000; 
const MIN_CHAR_DIFF = 50; 

// ミリ秒から「分」を算出
const intervalMinutes = Math.floor(SUMMARY_INTERVAL_MS / (60 * 1000));

async function autoGenerateSummary() {
  if (isSummarizing || isExplicitlyStopped || !db) return;

  const now = Date.now();
  
  try {
    const listRef = ref(db, 'transcripts/list');
    const snapshot = await get(listRef);
    
    if (!snapshot.exists()) return;

    const data = snapshot.val();
    const logs = Object.values(data).map(item => item.content);
    let fullText = logs.join('\n');
    const totalCharCount = fullText.trim().length;

    if (totalCharCount - lastSummaryCharLength < MIN_CHAR_DIFF) return;

    if (fullText.length > 4000) {
      fullText = fullText.slice(-4000);
    }

    isSummarizing = true;

    // プロンプトをシンプルな箇条書き指定に変更
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prompt: `以下は会議の文字起こしログです。
以下のルールを厳格に守って、内容を箇条書きでまとめてください。

【出力ルール】
・「### 主要な話題」「### 議論のポイント」などの見出しやタイトルは絶対に付けないでください。
・「〇〇さんの意見」「〇〇の発言」などの発言者情報は含めないでください。
・Markdownの見出し記号（### や ** など）は使わず、シンプルな行頭の「・」または「-」を使った箇条書きのみで出力してください。
・短くわかりやすい文章でまとめ、内容をダイレクトに箇条書きで並べてください。

【文字起こしログ】
${fullText}`
      })
    });

    if (!response.ok) throw new Error(`API接続エラー: HTTP ${response.status}`);
    const resData = await response.json();
    if (resData.error) throw new Error(`Gemini APIエラー: ${resData.error.message || JSON.stringify(resData.error)}`);

    const summaryResult = (
      resData.candidates?.[0]?.content?.parts?.[0]?.text ||
      resData.text || resData.content || resData.message || ''
    ).trim();

    if (summaryResult) {
      // intervalMinutes（設定された分数）も一緒に Firebase へ保存
      await set(ref(db, 'transcripts/summary'), {
        text: summaryResult,
        updatedAt: Date.now(),
        intervalMinutes: intervalMinutes 
      });

      lastSummaryTime = now;
      lastSummaryCharLength = totalCharCount;
    }

  } catch (err) {
    showError("自動要約エラー: " + err.message);
  } finally {
    isSummarizing = false;
  }
}

    setInterval(() => {
      const now = Date.now();
      if (now - lastSummaryTime >= SUMMARY_INTERVAL_MS) {
        autoGenerateSummary();
      }
    }, 60 * 1000);

    // ボタンの登録と強固な起動処理
    startBtn.addEventListener('click', () => {
      if (!recognition) {
        alert("音声認識機能が初期化されていません。対応ブラウザ（Chrome/Edge）でお試しください。");
        return;
      }
      isExplicitlyStopped = false;
      lastSentFinalText = '';
      clearError();

      try {
        recognition.start();
      } catch (e) {
        // すでに動作中の場合は一旦ストップしてから再起動
        console.warn("認識再起動処理中:", e.message);
        try {
          recognition.stop();
          setTimeout(() => recognition.start(), 200);
        } catch(err) {
          showError("認識起動失敗: " + err.message);
        }
      }
    });

    stopBtn.addEventListener('click', () => {
      if (!recognition) return;
      isExplicitlyStopped = true;
      try {
        recognition.stop();
      } catch(e){}
    });

    clearBtn.addEventListener('click', async () => {
      if (!db) return;
      if (confirm('すべての字幕ログおよび要約を削除しますか？')) {
        try {
          await remove(ref(db, 'transcripts'));
          lastSentFinalText = '';
          previewArea.innerHTML = 'ログと要約をクリアしました。';
          alert('消去完了しました。');
          clearError();
        } catch (error) {
          showError("ログ消去エラー: " + error.message);
        }
      }
    });
  </script>
</body>
</html>
