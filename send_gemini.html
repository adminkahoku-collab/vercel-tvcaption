<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>リアルタイム字幕 Sender (AI補正＆非同期要約モード)</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 1. Firebase Realtime Database 初期化設定
    const firebaseConfig = {
      databaseURL: "https://caption-db-cbff9-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const clearBtn = document.getElementById('clearBtn');
    const statusEl = document.getElementById('status');
    const previewArea = document.getElementById('previewArea');

    let recognition;
    let isExplicitlyStopped = false;
    let interimTimer = null;
    let forceFinalTimer = null;
    let lastInterimText = '';
    let lastSentFinalText = '';

    // 要約制御用
    const SUMMARY_INTERVAL_MS = 60000; // 最低60秒間隔
    let lastSummaryTime = 0;
    let isSummarizing = false;
    let recentLogs = [];

    // Vercel /api/chat による校正
    async function correctTextWithGemini(text) {
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: `以下の音声認識テキストの同音異義語・誤字を修整し、自然な日本語に補正してください。余計な解説は出力せず補正結果のみ返してください。\n\n【テキスト】\n${text}`
          })
        });
        const data = await response.json();
        return data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || text;
      } catch (err) {
        console.warn('AI Correction Error:', err);
        return text; // エラー時は原文を返す
      }
    }

    // 非同期要約処理
    function triggerAsyncSummary() {
      const now = Date.now();
      if (now - lastSummaryTime >= SUMMARY_INTERVAL_MS && !isSummarizing && recentLogs.length > 0) {
        lastSummaryTime = now;
        isSummarizing = true;

        generateSummaryAsync(recentLogs.slice()).finally(() => {
          isSummarizing = false;
        });
      }
    }

    async function generateSummaryAsync(logsToSummarize) {
      const promptText = `以下は会議の直近の発言ログです。会議の要点、決定事項、主要な質疑応答（特に予算関連の「款・項・目」やページ数など）を箇条書きで簡潔に要約してください。\n\n【発言ログ】\n${logsToSummarize.join('\n')}`;

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: promptText })
        });
        const data = await response.json();
        const summaryResult = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();

        if (summaryResult) {
          const summaryRef = ref(db, 'transcripts/summary');
          await set(summaryRef, {
            text: summaryResult,
            updatedAt: Date.now()
          });
          console.log('要約をFirebaseへ自動更新しました');
        }
      } catch (err) {
        console.error('AI Summary Error:', err);
      }
    }

    // Firebase 送信処理
    async function processAndSend(text, isInterim = false) {
      const trimmedText = text ? text.trim() : '';
      if (!trimmedText) return;

      if (isInterim) {
        const interimRef = ref(db, 'transcripts/interim');
        await set(interimRef, {
          content: trimmedText,
          timestamp: Date.now()
        });
        updatePreview(`[認識中...] ${trimmedText}`, true);
      } else {
        if (trimmedText === lastSentFinalText) {
          await remove(ref(db, 'transcripts/interim'));
          return;
        }

        lastSentFinalText = trimmedText;
        await remove(ref(db, 'transcripts/interim'));
        updatePreview(`[AI補正中...] ${trimmedText}`, false);

        // 確定メッセージをAI補正（バックグラウンド処理）
        const correctedText = await correctTextWithGemini(trimmedText);

        // Firebase へ確定保存
        const listRef = ref(db, 'transcripts/list');
        await push(listRef, {
          content: correctedText,
          timestamp: Date.now()
        });
        updatePreview(`[確定] ${correctedText}`, false);

        // 要約バッファ更新＆要約トリガー
        recentLogs.push(correctedText);
        if (recentLogs.length > 50) recentLogs.shift();
        triggerAsyncSummary();
      }
    }

    function updatePreview(msg, isInterim) {
      previewArea.textContent = msg;
      previewArea.style.color = isInterim ? '#aaa' : '#00e676';
    }

    // Web Speech API 設定
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = () => { 
        statusEl.textContent = '認識中（AI補正＆要約モード）'; 
        statusEl.style.color = '#00e676';
      };
      
      recognition.onend = () => { 
        if (lastInterimText.trim() !== '') {
          processAndSend(lastInterimText, false);
          lastInterimText = '';
        }
        
        if (!isExplicitlyStopped) {
          recognition.start();
        } else {
          statusEl.textContent = '停止中';
          statusEl.style.color = '#ff5252';
        }
      };

      recognition.onresult = (event) => {
        let interimText = '';
        let currentFinal = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            currentFinal += event.results[i][0].transcript;
          } else {
            interimText += event.results[i][0].transcript;
          }
        }

        clearTimeout(interimTimer);
        clearTimeout(forceFinalTimer);

        if (currentFinal !== '') {
          lastInterimText = '';
          processAndSend(currentFinal, false);
        } else if (interimText !== '') {
          lastInterimText = interimText;
          
          interimTimer = setTimeout(() => {
            processAndSend(interimText, true);
          }, 300);

          forceFinalTimer = setTimeout(() => {
            if (lastInterimText.trim() !== '') {
              processAndSend(lastInterimText, false);
              lastInterimText = '';
            }
          }, 2500);
        }
      };
    } else {
      alert('お使いのブラウザは Web Speech API に対応していません。Google Chrome をご使用ください。');
    }

    // ボタンイベント
    startBtn.addEventListener('click', () => {
      if (!recognition) return;
      isExplicitlyStopped = false;
      lastSentFinalText = '';
      recognition.start();
      startBtn.disabled = true;
      stopBtn.disabled = false;
    });

    stopBtn.addEventListener('click', () => {
      if (!recognition) return;
      isExplicitlyStopped = true;
      clearTimeout(interimTimer);
      clearTimeout(forceFinalTimer);
      
      if (lastInterimText.trim() !== '') {
        processAndSend(lastInterimText, false);
        lastInterimText = '';
      }

      recognition.stop();
      startBtn.disabled = false;
      stopBtn.disabled = true;
    });

    clearBtn.addEventListener('click', async () => {
      if (confirm('すべての字幕ログと要約を削除しますか？')) {
        try {
          const rootRef = ref(db, 'transcripts');
          await remove(rootRef);
          
          lastInterimText = '';
          lastSentFinalText = '';
          recentLogs = [];
          previewArea.textContent = 'ログと要約をクリアしました。';
          previewArea.style.color = '#888';
          
          alert('消去完了しました。');
        } catch (error) {
          console.error('消去エラー:', error);
          alert('消去に失敗しました。');
        }
      }
    });
  </script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #222; color: #fff; }
    button { padding: 10px 20px; font-size: 1rem; margin-right: 10px; cursor: pointer; }
    .status { margin-top: 15px; font-weight: bold; }
    .preview { margin-top: 20px; padding: 10px; border: 1px solid #555; background: #333; min-height: 50px; line-height: 1.5; }
  </style>
</head>
<body>

  <h2>音声認識 送信画面 (AI補正＆非同期要約モード)</h2>

  <div>
    <button id="startBtn">認識＆送信開始</button>
    <button id="stopBtn" disabled>停止</button>
    <button id="clearBtn">ログ消去</button>
  </div>

  <div class="status">ステータス: <span id="status" style="color: #ff5252;">停止中</span></div>

  <div class="preview" id="previewArea">ここに認識されたテキストが表示されます...</div>

</body>
</html>
